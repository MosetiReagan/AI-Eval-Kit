name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.23.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run unit & integration tests
        run: pnpm test

      - name: Run deterministic AI evaluation fixtures
        run: |
          node apps/cli/dist/bin.js doctor
          node apps/cli/dist/bin.js validate --config fixtures/simple-llm/ai-eval.yaml
          node apps/cli/dist/bin.js test --ci --config fixtures/simple-llm/ai-eval.yaml
